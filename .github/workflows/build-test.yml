name: Build Test
on: [push, pull_request]

jobs:
  cache-and-install:
    name: Build Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: 10
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Install dependencies NUI
        run: pnpm install --frozen-lockfile
      - name: Build Bundles
        run: pnpm build